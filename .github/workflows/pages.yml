# Publica o front-end estático em GitHub Pages (ogabrielmoreira.github.io/veroid/).
# O caminho do Pages coincide com o BASE_PATH '/veroid/' do Vite, então o build sai pronto.
# Atenção: o Pages é estático — as rotas /veroid/api/* do Worker não existem aqui.
# O deploy completo (com Worker e Claude Vision) continua sendo `npm run deploy`, ver docs/DEPLOY.md.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Valores públicos por design: já vão no bundle que o navegador baixa.
      # A proteção dos dados é o RLS no Supabase, não o segredo da chave.
      VITE_SUPABASE_URL: https://ajhfysjgaqduomkmkeec.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_OHrtmLpE3dLqlIs1Wtuhvw_4w_Pf3nZ
      VITE_LOGIN_EMAIL_OTP: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # SPA: o Pages devolve 404.html em qualquer rota profunda (/veroid/painel, /veroid/auth/callback).
      # Servindo o mesmo HTML, o React Router assume a rota no cliente.
      - name: Fallback de SPA e .nojekyll
        run: |
          cp dist/veroid/index.html dist/veroid/404.html
          touch dist/veroid/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/veroid

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
